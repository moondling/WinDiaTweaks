[profileEmoji] off
title: Profile emoji
desc: An emoji at the top of the sidebar.
section: Sidebar & Tab Bar
icon: E76E
value: 🙂

[dontPopUpDownloads] off
title: Don't pop up downloads
desc: Downloads list stays closed.
section: Sidebar & Tab Bar
icon: E896

[translucentSidebar] off
title: Translucent sidebar
desc: See the page through the floating sidebar.
section: Sidebar & Tab Bar
icon: E790
match name=SidebarFloatingSurface => Opacity=0.7

[tidyTabs] off
title: Tidy Tabs
desc: A line above your tabs with Tidy and Clear.
note: Tidy uses your Dia chat: each tidy counts toward your chat usage and is saved in your chat history.
section: Tidy Tabs
icon: E8CB
# Done in code (src/ui.cpp), after DiaTweaks' Tidy Tabs on macOS: a line at the top of your tabs with
# Tidy (a broom) and Clear. Tidy asks Dia's chat, opened out of sight and without its end-of-reply
# sound, to group your open tabs by topic; its own tools make, name and color the groups, and the line
# rolls as a wave until it's done. Clear is Dia's own Close All Tabs (sidebar right-click), confirmed.
# (Tidy needs a web page in front: Dia's chat is off on the New Tab page.)

[tidyTabsShow] on
title: Show
desc: When the line with the buttons shows.
section: Tidy Tabs
icon: E7B3
switch: none
value: hover
choices: hover=On hover, always=Always

[tidyTabsStyle] on
title: Buttons
desc: How the buttons look.
section: Tidy Tabs
icon: E8A9
switch: none
value: text
choices: icons=Icons only, text=Icons with text

[tidyTabsButtons] on
title: Which buttons
desc: What the line offers.
section: Tidy Tabs
icon: E71D
switch: none
value: both
choices: both=Tidy and Clear, tidy=Tidy only, clear=Clear only

[hideWindowButtons] off
title: Hide window buttons
desc: Hides minimize, maximize and close.
section: Window
icon: E8BB
# Hiding the buttons is done in code (src/ui.cpp) so their spots also stop acting as buttons.
match name=NavigationBarContent => Margin=0,0,0,0

[windowMaterial] off
title: Window material
desc: Mica or Acrylic behind the sidebar.
section: Window
icon: E771
value: mica
choices: mica=Mica, micaAlt=Mica Alt, acrylic=Acrylic

[normalLaunch] off
title: Patch Dia however it's opened
desc: Patches Dia from any icon or link.
section: Opening Dia
icon: E8A7
# Done in code (src/diatweaks.cpp): DiaLauncher.exe --watch, started at sign-in from the Startup folder.

[checkForUpdates] on
title: Check for updates automatically
desc: Checks for updates when Dia opens.
section: Updates
icon: E895
# Done in code (src/ui.cpp): runs `diatweaks check` in the background; updates install with `diatweaks update`.
