# DiaTweaks for Windows - tweak definitions
# Windows counterparts of the tweaks in JaceThings/DiaTweaks (macOS), matched to Dia for Windows' own UI.
# Switch them in Dia (Settings > Patches) or with `diatweaks enable <key>`.
#
# A tweak:
#   [key] on|off
#   title:   name shown in Settings > Patches
#   desc:    one-line description
#   section: group heading in Settings > Patches
#   icon:    Segoe Fluent Icons code point (hex)
#   value:   current option, for tweaks that have one
#   choices: value=Label, value=Label   (shown as a drop-down; with an "off" choice, the drop-down
#            replaces the On/Off switch and picking "off" turns the tweak off)
#   switch:  none   (a drop-down only, always on: an option of the tweak above it)
#   restart: yes    (applies when Dia next opens: changing it shows a "Reopen Dia" button)
#   match <condition>... => Property=Value; Property=Value
#
# Conditions (all must hold):
#   type=<element type>   name=<element name>   index=<child index>
#   parentType=<type>     parentName=<name>     ancestor=<name>   ancestorType=<type>
#   upN=<name>            the element N levels up has this name (up1 = parent)
#   tweak=<key>           another tweak is on
#   value=<value>         this tweak's own option is <value>
#   state=<state>         hover (pointer at the window top), sidebarOpen, newTab, showToolbar, split,
#                         topTabs (tabs in the top bar), titleBarUp (toolbar up in the title bar)
#   ~<text> as a value means "contains", and a "!" after the field name means "not".
# Values are written the way WinUI prints them: Visibility=Collapsed, Margin=0,0,0,0, Opacity=0.5.
# Tweaks with no match lines are implemented in code (src/ui.cpp).

[preset] on
title: Preset
desc: A ready-made set of patches.
icon: E771
value: none
choices: none=None, arc=Arc, arcWindows=Arc (Windows), custom=Custom

[edgeToEdge] off
title: Edge-to-edge web content
desc: No gap around pages.
section: Page
icon: E740
match type=Grid index=0 up2=ClientAreaPresenter => Margin=0,0,0,0

[squareCorners] off
title: Square corners by the sidebar
desc: Straight page corners.
section: Page
icon: E739

[peek] off
title: Peek
desc: Preview links in a card.
section: Peek
icon: E890
# Done in code (src/peek.cpp). Peek clips a live Dia window to the card.

[peekTrigger] on
title: Trigger
desc: How a Peek opens.
section: Peek
icon: E8B0
switch: none
value: shift
choices: shift=Shift+click, hold=Hold on a link, ctrlShift=Ctrl+Shift+click, alt=Alt+click

[peekAnimation] on
title: Animation
desc: How the card flies in and out.
section: Peek
icon: E7F4
switch: none
value: genie
choices: genie=Genie, easeInOut=Ease In/Out, zoom=Zoom

[peekExpand] on
title: Open as tab
desc: How a Peek becomes a tab.
section: Peek
icon: E740
switch: none
value: blend
choices: blend=Blend, dissolve=Dissolve, moveFirst=Move first, snap=Snap

[hideToolbar] off
title: Hide toolbar (reveal on hover)
desc: Shows the toolbar only on hover.
section: Toolbar
icon: E8A0
# Done in code (src/ui.cpp): the toolbar slides up out of the window together with the page, and back
# down while the pointer is at the top edge, when a "show toolbar" tweak below wants it, or while you
# type in the address bar.

[showToolbarWithSidebar] off
title: Show toolbar with the sidebar
desc: Keeps the toolbar while the sidebar is open.
section: Toolbar
icon: E8A9

[showToolbarOnNewTab] off
title: Show toolbar on new tab pages
desc: Keeps the toolbar on new tabs.
section: Toolbar
icon: E710

[titleBar] off
title: Toolbar in the title bar
desc: Toolbar in the window's top row, in the sidebar's colors.
note: With tabs on top, the toolbar, Dia logo and tab chevron stay in the title bar.
section: Toolbar
icon: E737
# Done in code (src/ui.cpp). The shown tab's toolbar moves out of its pane into a row at the top of the
# window, level with the window buttons, so the page card and side panels start below it and it no longer
# moves when a side panel opens. It comes in the sidebar's look: the strip turns see-through (sidebar color
# or window material shows), and its icons, popovers and the window buttons take the sidebar's colors.
# Off: Dia's own adaptive toolbar.
# The Arc URL bar in the sidebar and Hide toolbar lay the toolbar out themselves and take priority over the
# move (Centered's strip goes up with the toolbar), and split view keeps a toolbar in each pane, as Dia has
# it (the colors stay in all three). While the toolbar is up there, state titleBarUp holds. Top tabs keep
# their native paging scroller, placed in a second row below the toolbar.
# Dia shows it from code (on chat pages once they scroll): Opacity too, which Dia leaves alone, so it stays gone.
match name=BottomSeparator => Visibility=Collapsed; Opacity=0
# The space name in the sidebar's top row: its hover box as tall as the toolbar's buttons (32 px; Dia pads it
# 4 px inside a 44 px button, 36 high). The row itself is centered on the toolbar in code. (Moved into the
# toolbar by the Arc URL bar, it's sized there.)
match name=SpaceSwitcherButton ancestor=WindowDragHeader state!=topTabs => MaxHeight=40
# The chat panel then starts right under the moved toolbar, level with the page.
match name=AssistantPanelHost state=titleBarUp => Margin=0,0,0,0
# Dia lays a drag button (WindowDragRegion) over the address box. Moved up here it no longer passes clicks
# on to the box, so the address can't be hovered or edited: it goes.
match name=WindowDragRegion state=titleBarUp => Visibility=Collapsed
# The address text then only displays; a click opens Dia's address box (src/ui.cpp HookAddressClicks).
# (Centered does this itself.)
match name=AddressRichEditBox tweak!=arcUrlBar state=titleBarUp => IsHitTestVisible=False

[arcUrlBar] off
title: Address bar
desc: Where the address and navigation buttons sit.
section: Toolbar
icon: E8A1
value: sidebar
choices: off=Toolbar (Dia), sidebar=Sidebar (Arc for Mac), windows=Centered (Arc for Windows)
# Sidebar: address bar and buttons in the sidebar (Arc on macOS); picking it turns Hide toolbar on, so the
# toolbar comes down on hover, and the other two turn it off. Centered: the toolbar stays (in Dia's colors,
# or up in the title bar in the sidebar's with Toolbar in the title bar) and shows just the site, centered
# between its page buttons; clicking it opens the command bar centered over the window. Done in code
# (src/ui.cpp).
# Arc (Windows): no loading bar in the address field.
match name=LoadingIndicatorLayer value=windows => Visibility=Collapsed
# Split view (Arc only): each pane's own toolbar keeps only its close (X) button; the selected pane's controls are
# in the sidebar. (Controls currently in the sidebar aren't under a page toolbar, so they stay visible.)
match name=SidebarToggleButton ancestor=NavigationBarContent state=split value!=windows => Visibility=Collapsed
match name=BackButton ancestor=NavigationBarContent state=split value!=windows => Visibility=Collapsed
match name=ForwardButton ancestor=NavigationBarContent state=split value!=windows => Visibility=Collapsed
match name=ReloadButton ancestor=NavigationBarContent state=split value!=windows => Visibility=Collapsed
match name=AssistantBarHost ancestor=NavigationBarContent state=split value!=windows => Visibility=Collapsed
match name=StatusPill ancestor=NavigationBarContent state=split value!=windows => Visibility=Collapsed
match name=PinnedExtensionsHost ancestor=NavigationBarContent state=split value!=windows => Visibility=Collapsed
match name=DownloadsHost ancestor=NavigationBarContent state=split value!=windows => Visibility=Collapsed
match name=ShareArtifactButton ancestor=NavigationBarContent state=split value!=windows => Visibility=Collapsed
match name=ExportLogsButton ancestor=NavigationBarContent state=split value!=windows => Visibility=Collapsed
match name=AdvancedChatUpsellHost ancestor=NavigationBarContent state=split value!=windows => Visibility=Collapsed
match name=ChatButtonHost ancestor=NavigationBarContent state=split value!=windows => Visibility=Collapsed
# Sidebar, otherwise: the toolbar that comes down is a thin title bar, 36 high (the 32 px buttons, 2 px above
# and below); its row is set in code (src/ui.cpp UpdateThinToolbar), the window buttons follow it.
match name=NavigationBarContent state!=split value=sidebar => Padding=0,2,4,2
match name=ChatButton ancestor=NavigationBarContent state!=split value=sidebar => MaxHeight=28; MinHeight=0

